name: Refresh Daily Puzzles

on:
  schedule:
    - cron: "5 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate daily puzzle calendar
        run: node scripts/generate-daily-puzzles.mjs
      - name: Commit updated puzzle files
        id: commit
        run: |
          if git diff --quiet -- data/puzzle-source.json data/puzzles.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No puzzle updates to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/puzzle-source.json data/puzzles.json
          git commit -m "Refresh CharterSchoodle daily puzzles"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      ref: ${{ needs.refresh.outputs.sha }}
